name: Build and Deploy Documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install sphinx

    - name: Generate and Build documentation
      run: |
        sphinx-quickstart -q -p "AppiumExtended" -a "Molokov Klim" docs
        cd docs
        sphinx-apidoc -o ./source/AppiumExtended ../AppiumExtended
        sphinx-apidoc -o ./source/AppiumGraph ../AppiumGraph
        sphinx-apidoc -o ./source/AppiumHelpers ../AppiumHelpers
        sphinx-apidoc -o ./source/AppiumNavigator ../AppiumNavigator
        sphinx-apidoc -o ./source/AppiumServer ../AppiumServer
        sphinx-apidoc -o ./source/AppiumWebElementExtended ../AppiumWebElementExtended
        sphinx-apidoc -o ./source/AppiumWebElementsExtended ../AppiumWebElementsExtended
        sphinx-apidoc -o ./source/terminal ../terminal
        sphinx-apidoc -o ./source/utils ../utils
        make html  # Или `sphinx-build -b html . _build/html`

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git checkout --orphan gh-pages  # Создание новой ветки, если она не существует
        git rm -rf .  # Удаление всех файлов из предыдущего коммита
        cp -r docs/_build/html/* .  # Копирование сгенерированных HTML-файлов в корневой каталог
        git add .
        git commit -m "Update documentation"
        git push origin gh-pages  # Замените на имя вашей ветки GitHub Pages, если она называется не `gh-pages`
